# ============================================
# FoodScan AI - Docker Compose Configuration
# Full-stack deployment with MySQL, Backend, Frontend
# ============================================

services:
  # ── MySQL Database ────────────────────────
  mysql:
    image: mysql:8.0
    container_name: foodscan-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-foodscan_db}
      MYSQL_USER: ${DB_USER:-foodscan_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-foodscan_password}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - foodscan-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Backend API ───────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodscan-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_USER: ${DB_USER:-foodscan_user}
      DB_PASSWORD: ${DB_PASSWORD:-foodscan_password}
      DB_NAME: ${DB_NAME:-foodscan_db}
      DB_PORT: 3306
      GROQ_API_KEY: ${GROQ_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      OPENFOODFACTS_USER_AGENT: ${OPENFOODFACTS_USER_AGENT:-FoodScanAI/1.0}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - foodscan-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # ── Frontend (Angular + Nginx) ────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodscan-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - foodscan-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

# ── Networks ──────────────────────────────
networks:
  foodscan-network:
    driver: bridge

# ── Volumes ───────────────────────────────
volumes:
  mysql_data:
    driver: local
